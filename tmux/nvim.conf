# Sourced from ~/.tmux.conf. Keeps tmux and Neovim from fighting over keys.
#
# tmux owns Ctrl-b (prefix) and Alt-h/j/k/l (resize). Neovim never binds those, and
# uses Space + the same letters for its own splits and buffers (see docs/nvim.md).

# Pass Esc to Neovim immediately instead of waiting to see if it starts an Alt key.
set -sg escape-time 10

# Popups match Neovim's floating windows: rounded hairline borders.
set -g popup-border-lines rounded
set -g popup-border-style "fg=#2c2b26"
set -g popup-style "bg=#0f0f0d"

# Prefix t : floating terminal, the same key as Space t in Neovim (replaces clock mode).
bind t display-popup -E -w 82% -h 72% -d "#{pane_current_path}" -T " Terminal "

# Prefix ? : tmux notes, the same key as Space ? in Neovim. Rendered by Neovim when
# available, plain text otherwise.
bind ? display-popup -E -B -w 92% -h 90% "command -v nvim >/dev/null && NVIM_NOTES=tmux nvim || less ~/.config/nvim/docs/tmux.md"
